name: Video Worker
on:
  pull_request:
    paths:
      - "video-worker/**"
      - "claude-code-video-toolkit/.agents/skills/video-pipeline/**"
      - "claude-code-video-toolkit/templates/ifeng-scenes/**"
      - "claude-code-video-toolkit/tools/**"
      - "claude-code-video-toolkit/deliverables/财经双人对话视频生成指令*/**"
      - "claude-code-video-toolkit/deliverables/财经双人对话视频生成指令.zip"
      - ".github/workflows/video-worker.yml"
      - "docker-compose.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: videocut_test
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: videocut_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U videocut_test -d videocut_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://videocut_test:test_only@127.0.0.1:5432/videocut_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --global pnpm@11.19.0
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg python3-venv bubblewrap dbus-user-session
      - name: Validate root deployment configuration
        run: docker compose config --quiet
      - name: Install and compile
        working-directory: video-worker
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm build
          python3 -m venv .venv
          .venv/bin/pip install jsonschema==4.26.0 requests==2.32.5 python-dotenv==1.2.1
      - name: PostgreSQL service contracts and recovery
        working-directory: video-worker
        run: pnpm test
      - name: 共用制作工具与媒体故障回归
        working-directory: claude-code-video-toolkit
        run: |
          ../video-worker/.venv/bin/python3 -m unittest discover -s tests -p 'test_*pipeline.py'
          ../video-worker/.venv/bin/python3 -m unittest discover -s tests -p 'test_shared_environment.py'
          ../video-worker/.venv/bin/python3 -m unittest discover -s tests -p 'test_two_stage.py'
          ../video-worker/.venv/bin/python3 -m unittest discover -s tests -p 'test_worker_stage.py'
      - name: Install admitted template
        working-directory: claude-code-video-toolkit/templates/ifeng-scenes
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm typecheck
          pnpm exec remotion browser ensure
      - name: 逐句 MP4 与成功版本续编（合成媒体）
        working-directory: video-worker
        run: |
          PYTHON="$PWD/.venv/bin/python3" pnpm test:media
          pnpm test:stages
      - name: Native Linux namespace and process cleanup (no model call)
        working-directory: video-worker
        run: |
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          bash deploy/install-bwrap-policy.sh
          RUN_HOST_TESTS=1 pnpm exec tsx --test tests/host-linux.test.ts
      - name: Build control services
        run: docker build -f video-worker/deploy/Dockerfile.control -t videocut-control:0.1.0 .
      - name: Automatic migration and API startup (no model call)
        env:
          MEDIA_ROOT: /tmp/videocut-ci/videos
          DATA_ROOT: /tmp/videocut-ci/data
        run: |
          docker compose up -d --wait api callbacks callback-mock
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://127.0.0.1:8080/healthz
      - name: Stop deployment smoke services
        if: always()
        run: docker compose down
