name: Video Worker
on:
  pull_request:
    paths:
      - "video-worker/**"
      - "claude-code-video-toolkit/.claude/skills/video-pipeline/**"
      - "claude-code-video-toolkit/.agents/skills/video-pipeline/**"
      - "claude-code-video-toolkit/templates/ifeng-scenes/**"
      - "claude-code-video-toolkit/tools/**"
      - ".github/workflows/video-worker.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: videocut_test
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: videocut_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U videocut_test -d videocut_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://videocut_test:test_only@127.0.0.1:5432/videocut_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --global pnpm@11.19.0
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg python3-venv
      - name: Install and compile
        working-directory: video-worker
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm build
          python3 -m venv .venv
          .venv/bin/pip install jsonschema==4.26.0 requests==2.32.5 python-dotenv==1.2.1
      - name: PostgreSQL service contracts and recovery
        working-directory: video-worker
        run: pnpm test
      - name: Trusted media validators and legacy pipeline
        working-directory: claude-code-video-toolkit
        run: ../video-worker/.venv/bin/python3 -m unittest discover -s tests -p 'test_*pipeline.py'
      - name: Install admitted template
        working-directory: claude-code-video-toolkit/templates/ifeng-scenes
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm typecheck
          pnpm exec remotion browser ensure
      - name: Five scenes and selective rerender (synthetic agent, real MP4)
        working-directory: video-worker
        run: PYTHON="$PWD/.venv/bin/python3" pnpm test:media
      - name: Build and inspect isolated runner (no model call)
        run: |
          docker build -f video-worker/deploy/Dockerfile.control -t videocut-control:0.1.0 .
          docker build -f video-worker/deploy/Dockerfile.runner -t videocut-runner:0.1.0 .
          cd video-worker
          DATA_ROOT="$RUNNER_TEMP/videocut" RUN_DOCKER_TESTS=1 pnpm test
