name: videocut
x-control: &control
  image: videocut-control:0.1.0
  build:
    context: ../..
    dockerfile: video-worker/deploy/Dockerfile.control
  env_file: ../.env
  environment:
    DATABASE_URL: postgresql://videocut:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/videocut
    TENANTS_FILE: /run/config/tenants.json
    MEDIA_ROOT: ${MEDIA_ROOT:-/home/ops/jiangzb/videos}
    DATA_ROOT: ${DATA_ROOT:-/home/ops/jiangzb/video-worker-data}
  volumes:
    - ../config/tenants.json:/run/config/tenants.json:ro
    # Identical host/container paths are required: Docker bind sources refer to the HOST daemon.
    - ${MEDIA_ROOT:-/home/ops/jiangzb/videos}:${MEDIA_ROOT:-/home/ops/jiangzb/videos}
    - ${DATA_ROOT:-/home/ops/jiangzb/video-worker-data}:${DATA_ROOT:-/home/ops/jiangzb/video-worker-data}
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped
services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: videocut
      POSTGRES_DB: videocut
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U videocut -d videocut']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    <<: *control
    command: ['node', 'dist/entrypoints/migrate.js']
    restart: 'no'
    profiles: ['tools']
  api:
    <<: *control
    command: ['node', 'dist/entrypoints/api.js']
    ports: ['127.0.0.1:8080:8080']
  worker:
    <<: *control
    command: ['/opt/video-worker/deploy/start-worker.sh']
    volumes:
      - ../config/tenants.json:/run/config/tenants.json:ro
      - ${MEDIA_ROOT:-/home/ops/jiangzb/videos}:${MEDIA_ROOT:-/home/ops/jiangzb/videos}
      - ${DATA_ROOT:-/home/ops/jiangzb/video-worker-data}:${DATA_ROOT:-/home/ops/jiangzb/video-worker-data}
      - /var/run/docker.sock:/var/run/docker.sock
  callbacks:
    <<: *control
    command: ['node', 'dist/entrypoints/callbacks.js']
  runner-image:
    image: videocut-runner:0.1.0
    build:
      context: ../..
      dockerfile: video-worker/deploy/Dockerfile.runner
    profiles: ['build']
    entrypoint: ['true']
volumes:
  postgres-data:
